server:
  port: ${SERVER_PORT:1235}

spring:
  application:
    name: mindhaven-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mind_haven?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:mindhaven}
    password: ${DB_PASSWORD:mindhaven2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt-secret: ${JWT_SECRET:mindhaven-local-dev-secret-change-me}
  jwt-ttl-seconds: ${JWT_TTL_SECONDS:86400}
  storage-dir: ${STORAGE_DIR:./storage}
  seed-demo-data: ${SEED_DEMO_DATA:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
